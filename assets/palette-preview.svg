<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" fill="none">
  <rect width="1200" height="760" rx="28" fill="#F5F8FC"/>
  <rect x="24" y="24" width="1152" height="712" rx="24" fill="url(#bg)"/>
  <rect x="56" y="56" width="1088" height="84" rx="22" fill="#FFFFFF" stroke="#DCE7F3"/>
  <text x="88" y="103" fill="#171A1F" font-size="28" font-family="Inter, Arial, sans-serif" font-weight="700">Codex Light UI Style</text>
  <text x="88" y="128" fill="#687386" font-size="15" font-family="Inter, Arial, sans-serif">Palette preview for cool white-blue workbench interfaces</text>

  <g transform="translate(56 176)">
    <text x="0" y="0" fill="#171A1F" font-size="20" font-family="Inter, Arial, sans-serif" font-weight="700">Core neutrals</text>
    <g transform="translate(0 28)">
      <rect x="0" y="0" width="172" height="120" rx="20" fill="#FFFFFF" stroke="#DCE7F3"/>
      <text x="18" y="34" fill="#171A1F" font-size="16" font-family="Inter, Arial, sans-serif" font-weight="600">panel</text>
      <text x="18" y="62" fill="#687386" font-size="14" font-family="Inter, Arial, sans-serif">#FFFFFF</text>
    </g>
    <g transform="translate(196 28)">
      <rect x="0" y="0" width="172" height="120" rx="20" fill="#F8FBFF" stroke="#DCE7F3"/>
      <text x="18" y="34" fill="#171A1F" font-size="16" font-family="Inter, Arial, sans-serif" font-weight="600">panel-soft</text>
      <text x="18" y="62" fill="#687386" font-size="14" font-family="Inter, Arial, sans-serif">#F8FBFF</text>
    </g>
    <g transform="translate(392 28)">
      <rect x="0" y="0" width="172" height="120" rx="20" fill="#F7FAFD" stroke="#DCE7F3"/>
      <text x="18" y="34" fill="#171A1F" font-size="16" font-family="Inter, Arial, sans-serif" font-weight="600">bg</text>
      <text x="18" y="62" fill="#687386" font-size="14" font-family="Inter, Arial, sans-serif">#F7FAFD</text>
    </g>
    <g transform="translate(588 28)">
      <rect x="0" y="0" width="172" height="120" rx="20" fill="#F5F8FC" stroke="#DCE7F3"/>
      <text x="18" y="34" fill="#171A1F" font-size="16" font-family="Inter, Arial, sans-serif" font-weight="600">bg-alt</text>
      <text x="18" y="62" fill="#687386" font-size="14" font-family="Inter, Arial, sans-serif">#F5F8FC</text>
    </g>
    <g transform="translate(784 28)">
      <rect x="0" y="0" width="172" height="120" rx="20" fill="#DCE7F3" stroke="#C8D8EA"/>
      <text x="18" y="34" fill="#171A1F" font-size="16" font-family="Inter, Arial, sans-serif" font-weight="600">border</text>
      <text x="18" y="62" fill="#5A6B82" font-size="14" font-family="Inter, Arial, sans-serif">#DCE7F3</text>
    </g>
  </g>

  <g transform="translate(56 390)">
    <text x="0" y="0" fill="#171A1F" font-size="20" font-family="Inter, Arial, sans-serif" font-weight="700">Blue emphasis</text>
    <g transform="translate(0 28)">
      <rect x="0" y="0" width="220" height="120" rx="20" fill="#339CFF"/>
      <text x="18" y="34" fill="#FFFFFF" font-size="16" font-family="Inter, Arial, sans-serif" font-weight="600">accent</text>
      <text x="18" y="62" fill="#E8F4FF" font-size="14" font-family="Inter, Arial, sans-serif">#339CFF</text>
    </g>
    <g transform="translate(244 28)">
      <rect x="0" y="0" width="220" height="120" rx="20" fill="#2F91FF"/>
      <text x="18" y="34" fill="#FFFFFF" font-size="16" font-family="Inter, Arial, sans-serif" font-weight="600">accent-strong</text>
      <text x="18" y="62" fill="#E8F4FF" font-size="14" font-family="Inter, Arial, sans-serif">#2F91FF</text>
    </g>
    <g transform="translate(488 28)">
      <rect x="0" y="0" width="220" height="120" rx="20" fill="#EAF4FF" stroke="#D6E8FF"/>
      <text x="18" y="34" fill="#2F91FF" font-size="16" font-family="Inter, Arial, sans-serif" font-weight="600">accent-soft</text>
      <text x="18" y="62" fill="#687386" font-size="14" font-family="Inter, Arial, sans-serif">#EAF4FF</text>
    </g>
    <g transform="translate(732 28)">
      <rect x="0" y="0" width="220" height="120" rx="20" fill="#DDEEFF" stroke="#CDE4FF"/>
      <text x="18" y="34" fill="#2F91FF" font-size="16" font-family="Inter, Arial, sans-serif" font-weight="600">active-bg</text>
      <text x="18" y="62" fill="#687386" font-size="14" font-family="Inter, Arial, sans-serif">#DDEEFF</text>
    </g>
  </g>

  <g transform="translate(56 604)">
    <text x="0" y="0" fill="#171A1F" font-size="20" font-family="Inter, Arial, sans-serif" font-weight="700">Type and motion notes</text>
    <text x="0" y="34" fill="#171A1F" font-size="16" font-family="Inter, Arial, sans-serif">Primary text: #171A1F</text>
    <text x="0" y="62" fill="#687386" font-size="16" font-family="Inter, Arial, sans-serif">Secondary text: #687386</text>
    <text x="390" y="34" fill="#171A1F" font-size="16" font-family="Inter, Arial, sans-serif">Shadow: 0 8px 24px rgba(120,160,210,0.08)</text>
    <text x="390" y="62" fill="#687386" font-size="16" font-family="Inter, Arial, sans-serif">State timing: 140ms-180ms, quiet transitions only</text>
    <text x="920" y="34" fill="#171A1F" font-size="16" font-family="Inter, Arial, sans-serif">Rule</text>
    <text x="920" y="62" fill="#687386" font-size="16" font-family="Inter, Arial, sans-serif">Blue = emphasis, not wallpaper</text>
  </g>

  <defs>
    <linearGradient id="bg" x1="600" y1="24" x2="600" y2="736" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FBFF"/>
      <stop offset="1" stop-color="#EEF5FC"/>
    </linearGradient>
  </defs>
</svg>
