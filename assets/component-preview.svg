<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" fill="none">
  <rect width="1440" height="960" fill="#F5F8FC"/>
  <rect x="16" y="16" width="1408" height="928" rx="28" fill="url(#bg)"/>

  <rect x="40" y="40" width="1360" height="76" rx="22" fill="#FFFFFF" stroke="#DCE7F3"/>
  <rect x="62" y="58" width="44" height="44" rx="14" fill="#FFFFFF" stroke="#DCE7F3"/>
  <rect x="73" y="69" width="22" height="22" rx="7" fill="#339CFF"/>
  <rect x="86" y="66" width="17" height="20" rx="6" fill="#EAF4FF" stroke="#9BCBFF"/>
  <text x="124" y="74" fill="#171A1F" font-size="28" font-family="Inter, Arial, sans-serif" font-weight="700">Codex Light App Surface</text>
  <text x="124" y="100" fill="#687386" font-size="15" font-family="Inter, Arial, sans-serif">Sidebar + workbench + cards + controls preview</text>

  <rect x="1220" y="58" width="82" height="40" rx="9999" fill="#FFFFFF" stroke="#DCE7F3"/>
  <text x="1250" y="83" fill="#171A1F" font-size="15" font-family="Inter, Arial, sans-serif" font-weight="600">Quiet</text>
  <rect x="1316" y="58" width="64" height="40" rx="9999" fill="#339CFF"/>
  <text x="1336" y="83" fill="#FFFFFF" font-size="15" font-family="Inter, Arial, sans-serif" font-weight="600">Go</text>

  <rect x="40" y="140" width="244" height="780" rx="26" fill="#FFFFFF" stroke="#DCE7F3"/>
  <text x="66" y="184" fill="#687386" font-size="14" font-family="Inter, Arial, sans-serif">Navigation</text>

  <rect x="58" y="214" width="208" height="56" rx="18" fill="#DDEEFF"/>
  <circle cx="86" cy="242" r="12" fill="#339CFF"/>
  <text x="110" y="248" fill="#2F91FF" font-size="16" font-family="Inter, Arial, sans-serif" font-weight="700">Overview</text>

  <g fill="#687386" font-family="Inter, Arial, sans-serif" font-size="15">
    <text x="110" y="324">Repository</text>
    <text x="110" y="392">Workbench</text>
    <text x="110" y="460">Exports</text>
    <text x="110" y="528">History</text>
    <text x="110" y="596">Settings</text>
  </g>
  <g fill="#687386">
    <circle cx="86" cy="318" r="10"/>
    <circle cx="86" cy="386" r="10"/>
    <circle cx="86" cy="454" r="10"/>
    <circle cx="86" cy="522" r="10"/>
    <circle cx="86" cy="590" r="10"/>
  </g>
  <rect x="58" y="842" width="208" height="46" rx="16" fill="#FFFFFF" stroke="#DCE7F3"/>
  <text x="106" y="870" fill="#687386" font-size="15" font-family="Inter, Arial, sans-serif" font-weight="600">Collapse rail</text>

  <rect x="308" y="140" width="1092" height="220" rx="26" fill="#FFFFFF" stroke="#DCE7F3"/>
  <text x="340" y="184" fill="#687386" font-size="14" font-family="Inter, Arial, sans-serif">Workbench summary</text>
  <text x="340" y="226" fill="#171A1F" font-size="38" font-family="Inter, Arial, sans-serif" font-weight="700">Current workspace supports 18 ready actions</text>
  <text x="340" y="262" fill="#687386" font-size="16" font-family="Inter, Arial, sans-serif">Cards stay white, structure comes from borders and spacing, and blue stays reserved for active controls.</text>

  <rect x="1086" y="176" width="126" height="42" rx="9999" fill="#FFFFFF" stroke="#DCE7F3"/>
  <text x="1122" y="202" fill="#171A1F" font-size="15" font-family="Inter, Arial, sans-serif" font-weight="600">Inspect</text>
  <rect x="1228" y="176" width="140" height="42" rx="9999" fill="#339CFF"/>
  <text x="1266" y="202" fill="#FFFFFF" font-size="15" font-family="Inter, Arial, sans-serif" font-weight="600">Primary action</text>

  <g transform="translate(340 290)">
    <rect x="0" y="0" width="216" height="52" rx="18" fill="#F8FBFF" stroke="#DCE7F3"/>
    <text x="18" y="22" fill="#687386" font-size="13" font-family="Inter, Arial, sans-serif">Inventory</text>
    <text x="18" y="38" fill="#171A1F" font-size="16" font-family="Inter, Arial, sans-serif" font-weight="700">132 accounts</text>
  </g>
  <g transform="translate(580 290)">
    <rect x="0" y="0" width="216" height="52" rx="18" fill="#F8FBFF" stroke="#DCE7F3"/>
    <text x="18" y="22" fill="#687386" font-size="13" font-family="Inter, Arial, sans-serif">Exports</text>
    <text x="18" y="38" fill="#171A1F" font-size="16" font-family="Inter, Arial, sans-serif" font-weight="700">7 recent files</text>
  </g>
  <g transform="translate(820 290)">
    <rect x="0" y="0" width="216" height="52" rx="18" fill="#F8FBFF" stroke="#DCE7F3"/>
    <text x="18" y="22" fill="#687386" font-size="13" font-family="Inter, Arial, sans-serif">Automation</text>
    <text x="18" y="38" fill="#171A1F" font-size="16" font-family="Inter, Arial, sans-serif" font-weight="700">Healthy</text>
  </g>

  <rect x="308" y="388" width="514" height="252" rx="24" fill="#FFFFFF" stroke="#DCE7F3"/>
  <text x="340" y="430" fill="#171A1F" font-size="30" font-family="Inter, Arial, sans-serif" font-weight="700">Export files</text>
  <rect x="710" y="406" width="84" height="32" rx="9999" fill="#EAF4FF" stroke="#D6E8FF"/>
  <text x="735" y="427" fill="#2F91FF" font-size="14" font-family="Inter, Arial, sans-serif" font-weight="700">7 files</text>
  <text x="340" y="474" fill="#171A1F" font-size="18" font-family="Inter, Arial, sans-serif" font-weight="700">Recent exports, download records, and cleanup actions live here.</text>
  <text x="340" y="514" fill="#687386" font-size="16" font-family="Inter, Arial, sans-serif">Quiet cards, pale metadata chips, and a single clear action keep the surface operational rather than promotional.</text>
  <text x="708" y="610" fill="#339CFF" font-size="16" font-family="Inter, Arial, sans-serif" font-weight="700">Open files</text>

  <rect x="850" y="388" width="550" height="252" rx="24" fill="#FFFFFF" stroke="#DCE7F3"/>
  <text x="882" y="430" fill="#171A1F" font-size="30" font-family="Inter, Arial, sans-serif" font-weight="700">Recent activity</text>
  <g transform="translate(882 470)">
    <rect x="0" y="0" width="486" height="52" rx="18" fill="#F8FBFF" stroke="#DCE7F3"/>
    <circle cx="24" cy="26" r="8" fill="#339CFF"/>
    <text x="44" y="31" fill="#171A1F" font-size="15" font-family="Inter, Arial, sans-serif" font-weight="600">Import scan completed</text>
    <text x="362" y="31" fill="#687386" font-size="14" font-family="Inter, Arial, sans-serif">12s ago</text>
  </g>
  <g transform="translate(882 536)">
    <rect x="0" y="0" width="486" height="52" rx="18" fill="#FFFFFF" stroke="#DCE7F3"/>
    <circle cx="24" cy="26" r="8" fill="#DCE7F3"/>
    <text x="44" y="31" fill="#171A1F" font-size="15" font-family="Inter, Arial, sans-serif" font-weight="600">Repair queue idle</text>
    <text x="393" y="31" fill="#687386" font-size="14" font-family="Inter, Arial, sans-serif">1m ago</text>
  </g>

  <rect x="308" y="668" width="514" height="252" rx="24" fill="#FFFFFF" stroke="#DCE7F3"/>
  <text x="340" y="710" fill="#171A1F" font-size="30" font-family="Inter, Arial, sans-serif" font-weight="700">Settings</text>
  <rect x="340" y="744" width="214" height="52" rx="18" fill="#FFFFFF" stroke="#DCE7F3"/>
  <text x="360" y="764" fill="#687386" font-size="13" font-family="Inter, Arial, sans-serif">Refresh interval</text>
  <text x="360" y="784" fill="#171A1F" font-size="16" font-family="Inter, Arial, sans-serif" font-weight="700">60 minutes</text>
  <rect x="576" y="744" width="214" height="52" rx="18" fill="#FFFFFF" stroke="#B7D9FF"/>
  <text x="596" y="764" fill="#687386" font-size="13" font-family="Inter, Arial, sans-serif">History retention</text>
  <text x="596" y="784" fill="#171A1F" font-size="16" font-family="Inter, Arial, sans-serif" font-weight="700">90 days</text>
  <rect x="640" y="846" width="150" height="42" rx="9999" fill="#339CFF"/>
  <text x="683" y="872" fill="#FFFFFF" font-size="15" font-family="Inter, Arial, sans-serif" font-weight="600">Save settings</text>

  <rect x="850" y="668" width="550" height="252" rx="24" fill="#FFFFFF" stroke="#DCE7F3"/>
  <text x="882" y="710" fill="#171A1F" font-size="30" font-family="Inter, Arial, sans-serif" font-weight="700">List + detail workbench</text>
  <rect x="882" y="746" width="248" height="142" rx="20" fill="#F8FBFF" stroke="#DCE7F3"/>
  <text x="906" y="776" fill="#687386" font-size="13" font-family="Inter, Arial, sans-serif">List region</text>
  <rect x="906" y="794" width="200" height="38" rx="14" fill="#DDEEFF"/>
  <text x="926" y="818" fill="#2F91FF" font-size="14" font-family="Inter, Arial, sans-serif" font-weight="700">Selected account</text>
  <rect x="906" y="844" width="200" height="26" rx="13" fill="#FFFFFF" stroke="#DCE7F3"/>
  <text x="926" y="861" fill="#687386" font-size="13" font-family="Inter, Arial, sans-serif">Quiet secondary row</text>
  <rect x="1152" y="746" width="216" height="142" rx="20" fill="#FFFFFF" stroke="#DCE7F3"/>
  <text x="1176" y="776" fill="#687386" font-size="13" font-family="Inter, Arial, sans-serif">Detail pane</text>
  <text x="1176" y="808" fill="#171A1F" font-size="18" font-family="Inter, Arial, sans-serif" font-weight="700">Focused inspector</text>
  <text x="1176" y="836" fill="#687386" font-size="14" font-family="Inter, Arial, sans-serif">Border-led, bright, and structured.</text>

  <defs>
    <linearGradient id="bg" x1="720" y1="16" x2="720" y2="944" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FBFF"/>
      <stop offset="1" stop-color="#EEF5FC"/>
    </linearGradient>
  </defs>
</svg>
